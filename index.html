<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asa de Cristal 2.5D - Fase 2 (Slots, Drops e Forja)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0b0d13;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* ================= TELA DE SELEÇÃO / CRIAÇÃO DE PERSONAGEM ================= */
    #char-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b2030 0%, #090b10 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      overflow-y: auto;
    }
    #char-screen h1 {
      font-size: 2.3rem;
      color: #ffa502;
      text-shadow: 0 0 20px rgba(255, 165, 2, 0.5);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #char-screen p.subtitle {
      color: #a4b0be;
      margin-bottom: 22px;
    }

    /* SLOTS DE PERSONAGENS SALVOS (LIMITE 3) */
    .slots-container {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .char-slot-card {
      width: 240px;
      background: #141824;
      border: 2px solid #2f3542;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      position: relative;
      transition: 0.2s;
    }
    .char-slot-card.occupied { border-color: #3742fa; }
    .char-slot-card.occupied:hover { border-color: #ffa502; transform: translateY(-3px); }
    .char-slot-card.empty {
      border-style: dashed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 175px;
      color: #747d8c;
    }
    .slot-badge {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 0.7rem;
      color: #747d8c;
      font-weight: bold;
    }
    .btn-del-slot {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid #ff4757;
      color: #ff6b81;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .btn-del-slot:hover { background: #ff4757; color: #fff; }
    .slot-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      margin: 8px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }
    .btn-enter-slot {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #2ed573;
      color: #0b0d13;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    .btn-enter-slot:hover { filter: brightness(1.1); }

    /* PAINEL DE CRIAR NOVO PERSONAGEM */
    #create-panel {
      background: rgba(22, 26, 38, 0.85);
      border: 1px solid #2f3542;
      border-radius: 14px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1050px;
    }
    #create-panel h2 {
      font-size: 1.1rem;
      color: #70a1ff;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    .class-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 18px;
    }
    .class-card {
      background: #161a26;
      border: 2px solid #2f3542;
      border-radius: 10px;
      width: 175px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .class-card:hover { transform: translateY(-4px); border-color: #70a1ff; }
    .class-card.selected {
      border-color: #ffa502;
      background: #212638;
      box-shadow: 0 0 15px rgba(255, 165, 2, 0.3);
    }
    .class-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }
    .class-card h3 { margin-bottom: 4px; font-size: 1rem; }
    .class-card .role { font-size: 0.72rem; color: #ffa502; margin-bottom: 6px; font-weight: bold; }
    .class-card .desc { font-size: 0.74rem; color: #ced6e0; line-height: 1.25; }

    .start-box { display: flex; gap: 10px; align-items: center; }
    .start-box input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 2px solid #2f3542;
      background: #0f121b;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .start-box input:focus { border-color: #ffa502; }
    .btn-play {
      padding: 10px 24px;
      background: linear-gradient(135deg, #ffa502, #ff6348);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-play:hover { filter: brightness(1.15); }
    .btn-play:disabled { background: #57606f; cursor: not-allowed; filter: none; }

    /* ================= CANVAS & HUD ================= */
    canvas { display: block; }

    #hud-top-left {
      position: fixed;
      top: 15px;
      left: 15px;
      background: rgba(18, 22, 33, 0.92);
      border: 1px solid #3742fa;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      min-width: 295px;
      z-index: 10;
    }
    .avatar-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid #ffa502;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      position: relative;
      background: #1e2436;
    }
    .lvl-badge {
      position: absolute;
      bottom: -5px;
      background: #ffa502;
      color: #000;
      font-weight: bold;
      font-size: 0.75rem;
      padding: 1px 7px;
      border-radius: 10px;
    }
    .stats-bars { flex: 1; }
    .player-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .br-tag { color: #ffa502; font-size: 0.85rem; }
    .bar-bg {
      width: 100%;
      height: 12px;
      background: #2f3542;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 5px;
      position: relative;
    }
    .bar-fill-hp { height: 100%; background: linear-gradient(90deg, #ff4757, #ff6b81); width: 100%; transition: width 0.15s; }
    .bar-fill-mp { height: 100%; background: linear-gradient(90deg, #1e90ff, #70a1ff); width: 100%; transition: width 0.15s; }
    .bar-text {
      position: absolute;
      inset: 0;
      font-size: 0.68rem;
      text-align: center;
      line-height: 12px;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }

    /* HUD SUPERIOR DIREITO */
    #hud-top-right {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 10;
    }
    .map-info {
      background: rgba(18, 22, 33, 0.92);
      border: 1px solid #2f3542;
      padding: 8px 14px;
      border-radius: 10px;
      text-align: right;
    }
    .map-name { color: #2ed573; font-weight: bold; font-size: 0.95rem; }
    .currency-row { font-size: 0.85rem; color: #f1c40f; margin-top: 3px; }
    .top-menu-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn-hud {
      background: #1e2436;
      border: 1px solid #57606f;
      color: #fff;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-hud:hover { border-color: #ffa502; color: #ffa502; transform: translateY(-2px); }
    .btn-hud.switch-char { border-color: #70a1ff; color: #70a1ff; }
    .btn-hud.switch-char:hover { background: #70a1ff; color: #0b0d13; }

    /* BARRA INFERIOR */
    #hud-bottom {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .skill-bar {
      display: flex;
      gap: 10px;
      background: rgba(18, 22, 33, 0.92);
      border: 2px solid #2f3542;
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .skill-slot {
      width: 54px;
      height: 54px;
      background: #1e2436;
      border: 2px solid #57606f;
      border-radius: 10px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
    }
    .skill-slot:hover { border-color: #ffa502; transform: translateY(-2px); }
    .skill-slot .key { position: absolute; top: 2px; left: 5px; font-size: 0.7rem; color: #a4b0be; font-weight: bold; }
    .skill-slot .icon { font-size: 1.5rem; }
    .skill-slot .cd-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
      color: #fff;
    }
    .btn-auto {
      width: 64px;
      height: 54px;
      border-radius: 10px;
      border: 2px solid #2ed573;
      background: #162b22;
      color: #2ed573;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: 0.2s;
    }
    .btn-auto.active {
      background: #2ed573;
      color: #0b0d13;
      box-shadow: 0 0 15px rgba(46, 213, 115, 0.6);
    }
    .xp-bar-container {
      width: 440px;
      height: 10px;
      background: #1e2436;
      border: 1px solid #2f3542;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, #9b59b6, #e056fd); width: 0%; transition: width 0.2s; }
    .xp-text { position: absolute; inset: 0; font-size: 0.65rem; text-align: center; line-height: 9px; color: #fff; font-weight: bold; }

    #controls-hint {
      position: fixed;
      bottom: 15px;
      left: 15px;
      background: rgba(18, 22, 33, 0.8);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.76rem;
      color: #a4b0be;
      line-height: 1.5;
      z-index: 10;
    }

    /* ================= JANELAS MODAIS (MOCHILA E FORJA) ================= */
    .modal-window {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #141824;
      border: 2px solid #ffa502;
      border-radius: 14px;
      width: 680px;
      max-width: 95vw;
      max-height: 85vh;
      display: none;
      flex-direction: column;
      z-index: 100;
      box-shadow: 0 15px 40px rgba(0,0,0,0.85);
    }
    .modal-header {
      padding: 14px 20px;
      background: #1c2233;
      border-bottom: 1px solid #2f3542;
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { color: #ffa502; font-size: 1.15rem; }
    .btn-close-modal {
      background: #ff4757;
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-body {
      padding: 18px;
      overflow-y: auto;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    /* EQUIPAMENTOS & MOCHILA */
    .equip-column {
      flex: 1;
      min-width: 230px;
      background: #0f121b;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #2f3542;
    }
    .equip-column h4, .bag-column h4 {
      font-size: 0.9rem;
      color: #a4b0be;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .equip-slot-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #181d2c;
      border: 1px solid #2f3542;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.84rem;
    }
    .stat-summary {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #2f3542;
      font-size: 0.82rem;
      color: #ced6e0;
      line-height: 1.6;
    }

    .bag-column {
      flex: 1.4;
      min-width: 280px;
      background: #0f121b;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #2f3542;
    }
    .bag-grid {
      display: grid;
      grid-template-columns: repeat(auto
